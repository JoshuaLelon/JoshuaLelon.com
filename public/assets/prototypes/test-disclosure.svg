<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><style>:root{--bg:#f5f6f3;--paper:#fff;--ink:#252a24;--muted:#596254;--edge:#d7dbd2;--highlight:#e7eedb;--green:#355529}@media(prefers-color-scheme:dark){:root{--bg:#252b38;--paper:#303847;--ink:#eaeef4;--muted:#b7c1cd;--edge:#48505d;--highlight:#394832;--green:#c0d9a0}}</style><rect width="1200" height="675" fill="var(--bg)"/><rect x="205" y="45" width="790" height="585" rx="16" fill="var(--paper)" stroke="var(--edge)"/><text x="255" y="104" font-family="monospace" font-size="14" fill="var(--muted)" letter-spacing="3">FIELD NOTES · 01</text><text x="255" y="165" font-family="Georgia,serif" font-size="44" fill="var(--ink)">A quieter interface</text><text x="255" y="228" font-family="Georgia,serif" font-size="26" fill="var(--ink)">A useful interface makes</text><rect x="530" y="200" width="340" height="38" fill="var(--highlight)"/><text x="540" y="228" font-family="Georgia,serif" font-size="26" fill="var(--green)">The next action legible</text><path d="M260 265V410" stroke="#9eae7b" stroke-width="3"/><text x="285" y="288" font-family="monospace" font-size="13" fill="var(--muted)">01 / INTENT</text><text x="285" y="330" font-family="system-ui,sans-serif" font-size="22" fill="var(--muted)">The label should say what happens when you use it.</text><text x="285" y="365" font-family="system-ui,sans-serif" font-size="22" fill="var(--muted)">“save draft” tells you more than “continue.”</text><text x="285" y="400" font-family="system-ui,sans-serif" font-size="22" fill="var(--green)" text-decoration="underline">Why does that matter?</text><text x="255" y="470" font-family="Georgia,serif" font-size="26" fill="var(--ink)">Without explaining every possible action at once.</text><path d="M255 515H945" stroke="var(--edge)"/><text x="255" y="565" font-family="Georgia,serif" font-size="23" font-style="italic" fill="var(--muted)">Does staying on the page mean keeping your place?</text></svg>