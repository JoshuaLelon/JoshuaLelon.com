<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="110 50 980 450"><style>:root{--bg:#f5f6f3;--paper:#fff;--ink:#252a24;--muted:#596254;--edge:#d7dbd2;--highlight:#e7eedb;--green:#355529}@media(prefers-color-scheme:dark){:root{--bg:#252b38;--paper:#303847;--ink:#eaeef4;--muted:#b7c1cd;--edge:#48505d;--highlight:#394832;--green:#c0d9a0}}</style><rect width="1200" height="675" fill="var(--bg)"/><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1.4" fill="var(--edge)"/></pattern></defs><rect x="110" y="65" width="980" height="410" rx="16" fill="url(#dots)" stroke="var(--edge)"/><rect x="360" y="125" width="480" height="270" rx="20" fill="var(--paper)" stroke="var(--edge)"/><rect x="390" y="155" width="58" height="58" rx="12" fill="var(--highlight)"/><text x="402" y="197" font-size="42" fill="var(--green)">↗</text><text x="390" y="270" font-family="system-ui,sans-serif" font-size="30" fill="var(--ink)">A little more room</text><text x="390" y="315" font-family="system-ui,sans-serif" font-size="19" fill="var(--muted)">The same card, a different state.</text></svg>